/* tip + flashcards + missed */
.tip-strip{background:linear-gradient(90deg,#6554bd,#3D2E8C);color:#fff;border-radius:14px;padding:14px 18px;margin:16px 0;display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.5}
.tip-strip strong{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);margin-bottom:3px}
.missed-list{display:grid;gap:8px;margin-top:14px}
.missed-item{background:#fff0f0;border:1px solid #f2cdce;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#87353b}
.fc-wrap{perspective:900px;height:220px;margin:0 auto 20px;max-width:600px;cursor:pointer}

.fc-back{background:#f0effc;border:2px solid #bcb6ee;transform:rotateY(180deg)}

.fc-q{font-size:18px;font-weight:800;color:var(--ink);line-height:1.3}
.fc-a{font-size:14px;color:#3e3d53;line-height:1.5}

<body>
<section class="registration" id="registration">
  <div class="registration-card">
    <h1>🤖 Ruta de QA mejora continua</h1>
    <p>Registra tus datos para guardar tu avance y comenzar la ruta de calidad.</p>
    <div class="registration-tabs">
      <button class="registration-tab active" data-reg-tab="login">Ya estoy registrado</button>
      <button class="registration-tab" data-reg-tab="catalog">Buscar en catálogo</button>
      <button class="registration-tab" data-reg-tab="manual">Registro manual</button>
    </div>

    <!-- Pestaña: Ya estoy registrado (Login) -->
    <div class="reg-pane active" id="reg-login">
      <div class="reg-field">
        <label for="loginUser">Correo</label>
        <input id="loginUser" type="email" autocomplete="email" placeholder="Ingresa tu correo (ej. nombre.apellido@despegar.com)">
      </div>
      <div id="loginError" class="reg-error"></div>
      <div class="reg-actions">
        <button class="btn" id="loginStart">Entrar al curso →</button>
      </div>
    </div>

    <!-- Pestaña: Buscar en catálogo -->
    <div class="reg-pane" id="reg-catalog">
      <div class="reg-field">

function apiCall(path,options={}){return fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options}).then(async response=>{const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'No se pudo conectar con el servidor');return data})}
function refreshUserHeader(){if(!currentUser)return;document.getElementById('user-name').textContent=currentUser.name||currentUser.email;document.getElementById('user-progress-text').textContent=`${progress.completed.length}/${MODULE_IDS.length} módulos`;}
async function hydrateProgress(){if(!currentUser)return;try{const data=await apiCall(`/api/progress/${encodeURIComponent(currentUser.email)}`);progress.completed=(data.modules||[]).filter(item=>item.completed).map(item=>item.module_id);progress.average=Number(data.average||0);saveProgress();refreshUserHeader();render(state.view);renderSidebar()}catch(error){progress=loadProgress();refreshUserHeader();showToast('Modo offline: no se pudo sincronizar el progreso')}}
async function markComplete(id){if(!progress.completed.includes(id)){progress.completed.push(id);saveProgress();refreshUserHeader();showToast('Módulo completado ✓')}if(currentUser){try{await apiCall('/api/progress',{method:'POST',body:JSON.stringify({email:currentUser.email,module_id:id})})}catch(error){showToast('Guardado localmente; sincronización pendiente')}}}
async function recordEvaluation(moduleId,score){if(!currentUser)return;try{const data=await apiCall('/api/evaluation',{method:'POST',body:JSON.stringify({email:currentUser.email,module_id:moduleId,score,max_score:100})});progress.average=Number(data.average||0);saveProgress();refreshUserHeader()}catch(error){showToast('Evaluación guardada localmente; sincronización pendiente')}}

 {phase:'WhatsApp · Aniversario',q:'El cliente pregunta por un beneficio de aniversario. ¿Qué respuesta es correcta?',choices:['Confirmarlo sin revisar condiciones','Verificar la promoción vigente y explicar sus condiciones antes de ofrecerla','Ignorarlo para avanzar'],correct:1,rule:'Verificar promociones vigentes',explanation:'Siempre verifica las promociones en el sistema antes de ofrecerlas. Prometer un beneficio sin confirmar su vigencia puede generar una PI si el cliente no puede usarlo.'},

 {phase:'WhatsApp · Objeción',q:'El cliente dice "está muy caro" después de ver la cotización. ¿Cuál es la mejor respuesta?',choices:['Le explicas que no hay descuentos y el precio es fijo.','Validas su preocupación, explicas el valor incluido y propones al menos una alternativa de producto, fecha o tarifa.','Lo dejas en pausa esperando que cambie de opinión.'],correct:1,rule:'Ofrece alternativas',explanation:'Ante una objeción de precio: 1) Valida la preocupación, 2) Explica el valor incluido, 3) Propón mínimo una alternativa concreta (diferente fecha, destino, categoría). Nunca dejes al cliente sin respuesta.'},
 {phase:'WhatsApp · Tiempos',q:'Eres agente fijo WA y el cliente dejó de responder. ¿Cuánto tiempo máximo antes de que sea falta grave?',choices:['5 minutos','15 minutos','45 minutos'],correct:1,rule:'Tiempos de espera WA',explanation:'Agente fijo WA: máximo 15 minutos de inactividad. Agentes multiskill: hasta 45 minutos. Superar estos tiempos sin interacción es considerado falta grave según los parámetros de calidad.'},
 {phase:'WhatsApp · Cross selling',q:'El cliente confirma un vuelo. ¿Cuándo es el momento ideal para ofrecer traslado o hotel?',choices:['Antes de cotizar el vuelo, para no perder tiempo.','Inmediatamente después de confirmar el vuelo, cuando el cliente aún está en modo de compra.','Solo si el cliente lo solicita explícitamente.'],correct:1,rule:'Cross selling WA',explanation:'El mejor momento para cross-selling es justo después de confirmar el primer servicio. El cliente ya superó la barrera de decisión y está más receptivo. Esperar o no ofrecerlo activamente son oportunidades perdidas.'}
];
function renderSimulator(){const el=document.getElementById('view-simulador');const steps=state.simChannel==='wa'?waSteps:callSteps;let html=layout('Simulador de venta','Toma decisiones como agente en llamada IN o WhatsApp.');html+=`<div class="tabs"><button class="tab ${state.simChannel==='call'?'active':''}" data-sim-channel="call">📞 Llamada IN</button><button class="tab ${state.simChannel==='wa'?'active':''}" data-sim-channel="wa">💬 WhatsApp</button></div>`;if(state.simIndex>=steps.length){const pct=Math.round(state.simScore/steps.length*100);progress.simulatorScore=pct;if(!state.simSubmitted){state.simSubmitted=true;recordEvaluation('simulador',pct)}markComplete('simulador');saveProgress();const missedHtml=state.simMisses.length?`<div style="margin-top:20px;text-align:left"><h3 style="font-size:15px;color:var(--primary);margin:0 0 10px">Parámetros para reforzar:</h3><div class="missed-list">${[...new Set(state.simMisses)].map(r=>`<div class="missed-item"><span>⚠️ ${esc(r)}</span><button class="btn ghost" style="font-size:12px;padding:6px 10px" data-action="parametros">Repasar →</button></div>`).join('')}</div></div>`:'<div style="margin-top:14px;background:#e9f8f1;border-radius:10px;padding:12px;color:#166045;font-size:14px">🎯 ¡Perfecto! Respondiste todo correctamente.</div>';html+=`<div class="card score-panel"><p class="eyebrow" style="color:var(--primary)">Simulación terminada</p><div class="score-big">${pct}%</div><p>Acertaste ${state.simScore} de ${steps.length} decisiones a la primera.</p>${missedHtml}<div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-action="restart-sim">Repetir simulador</button><button class="btn ghost" data-action="pis">Siguiente: PIs y auditoría →</button></div></div>`;el.innerHTML=html;return}const s=steps[state.simIndex];html+=`<article class="sim-card card"><div class="sim-meta"><span>${esc(s.phase)}</span><span>Decisión ${state.simIndex+1} de ${steps.length}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${state.simIndex/steps.length*100}%"></div></div><h2>${esc(s.q)}</h2><div class="scenario">${state.simChannel==='wa'?'💬':'☎️'} <strong>Contexto:</strong> ${state.simChannel==='wa'?'Atiendes un chat de cotización.':'Atiendes a un cliente que cotiza un paquete de viaje.'}</div><div class="choices">${s.choices.map((c,i)=>`<button class="choice" data-sim-choice="${i}"><span class="choice-letter">${String.fromCharCode(65+i)}</span><span>${esc(c)}</span></button>`).join('')}</div>${state.simFeedback?`<div class="feedback ${state.simFeedback.good?'good':'bad'}"><strong>${state.simFeedback.good?'¡Correcto!':'Revisa esta decisión'}</strong><p style="margin:6px 0 0">${esc(state.simFeedback.text)}</p>${state.simFeedback.rule?`<p style="margin:8px 0 0;font-size:12px;font-weight:700;opacity:.75">Parámetro: ${esc(state.simFeedback.rule)}</p>`:''}</div><div style="margin-top:15px"><button class="btn" data-action="${state.simFeedback.good?'next-sim':'retry-sim'}">${state.simFeedback.good?'Siguiente decisión →':'Intentar de nuevo'}</button>${state.simFeedback.good?'':` <button class="btn ghost" style="margin-left:8px" data-action="next-sim">Continuar igual →</button>`}</div>`:''}</article>`;el.innerHTML=html}

html+=`<div class="card pad" style="margin-top:18px"><h2>💡 ¿Cómo te ayuda Trix en el día a día?</h2><div class="check-list"><li><div><strong>🔍 Ve lo que a veces no ves</strong><br><span style="font-size:13px;color:var(--muted)">Cuando atiendes una llamada, es difícil notarlo todo. Trix detecta momentos clave que pasaron desapercibidos.</span></div></li><li><div><strong>🎯 Te dice qué técnica faltó</strong><br><span style="font-size:13px;color:var(--muted)">Si el cliente estaba listo para comprar y no lo cerraste, o si había una oportunidad de ofrecer algo más, Trix lo señala.</span></div></li><li><div><strong>📈 Te ayuda a crecer más rápido</strong><br><span style="font-size:13px;color:var(--muted)">Con feedback específico por llamada, aprendes mucho más rápido que con una capacitación general.</span></div></li></div></div>`;
html+=`<div class="card pad" style="margin-top:18px"><h2>Las 8 técnicas que miro</h2><p style="color:var(--muted);font-size:14px;margin:0 0 16px">No son reglas rígidas — son habilidades que los mejores agentes usan de forma natural. Con ejemplos reales de cómo suenan en una llamada.</p><div class="param-list" style="grid-template-columns:repeat(2,1fr)">`;
const tecnicas=[
 {icon:'🔎',nombre:'1. Descubrimiento de necesidades',desc:'pregunta antes de ofrecer. Si no sabes qué quiere el cliente, cualquier oferta es un disparo al aire.',ej:'Agente: "cuéntame un poco, ¿para cuándo sería el viaje y cuántos van? ¿Buscas algo tranquilo o con actividades?"',trix:'El agente no ofrece nada hasta entender el panorama completo. Las preguntas van encadenadas y son abiertas.'},
 {icon:'🛡️',nombre:'2. Manejo de objeciones',desc:'Cuando el cliente dice "es caro" o "lo pienso", no es un rechazo — es una señal de que necesita más información.',ej:'Agente: "Entiendo, y tiene sentido mirar bien el precio. Lo que pasa es que este paquete ya incluye traslados, hotel y seguro — si lo armas por separado te sale más. ¿quieres que te muestre el desglose?"',trix:'No se puso a la defensiva ni bajó el precio. Validó, explicó el valor y terminó con una pregunta que vuelve a involucrar al cliente.'},

 {icon:'⏱️',nombre:'4. Genera urgencia',desc:'Dá un motivo legítimo para decidir hoy — no presión vacía, sino información real que ayuda al cliente a no perder la oportunidad.',ej:'Agente: "Este vuelo tiene solo 3 lugares disponibles y la tarifa vence esta noche. Mañana no te puedo garantizar ni el precio ni el asiento."',trix:'Dos argumentos de urgencia juntos: escasez de asientos + vencimiento de tarifa. Cada uno legítimo y verificable.'},
 {icon:'🔒',nombre:'5. Cierre activo',desc:'El momento más importante: pides la venta. No esperas que el cliente lo proponga — lo invitas a decidir.',ej:'Cliente: "Lo consulto con mi pareja primero." Agente: "¿Qué te parece si lo reservamos ahora y si cambia algo lo ajustamos? El precio de hoy no lo puedo asegurar mañana."',trix:'Detectó que el cliente iba a "congelarse" y actuó: validó, ofreció una salida sin riesgo y sumó urgencia. No fue presión — fue una propuesta inteligente.'},
 {icon:'⬆️',nombre:'6. Upsell',desc:'ofreces una versión mejor de lo mismo: categoría de habitación superior, vuelo premium, servicio adicional dentro del mismo producto.',ej:'Agente: "También hay Premium Economy — más espacio, acceso al salón y equipaje incluido. Son 12 horas de vuelo, así que vale la pena. La diferencia para dos es $170.000. ¿Lo sumamos?"',trix:'Usó el contexto de 12 horas de vuelo como argumento de valor antes de nombrar el precio. Estructura correcta: valor → precio → cierre.'},

 {icon:'📅',nombre:'8. Seguimiento',desc:'Si el cliente no compra hoy, no significa que no va a comprar nunca. La diferencia está en lo que pasa después de colgar.',ej:'Cliente: "Lo hablo con mi pareja." Agente: "¿Qué te parece si mañana a las 10 te llamo yo? Así tienen toda la noche para hablarlo. Y ahora te mando el resumen por mail."',trix:'Convirtió un "lo pienso" en un compromiso mutuo con hora y canal definidos. Doble seguimiento: llamada + mail.'}

html+=`<div class="card pad" style="margin-top:18px"><h2>🧠 Actitud — Lo que define a los mejores agentes</h2><p style="color:var(--muted);font-size:14px;margin:0 0 16px">puedes saber todas las técnicas de memoria — pero si tu actitud no está presente, el cliente lo siente. Trix mira los dos planos.</p><div class="check-list"><li><div><strong>🎵 Tono y calidez</strong><br><span style="font-size:13px;color:var(--muted)">¿suenas genuino o mecánico? ¿Cambia tu energía según el estado del cliente?</span></div></li><li><div><strong>👂 Escucha activa</strong><br><span style="font-size:13px;color:var(--muted)">¿usas lo que el cliente te dijo para personalizar la propuesta, o ignoras sus respuestas?</span></div></li><li><div><strong>💡 Proactividad</strong><br><span style="font-size:13px;color:var(--muted)">¿propones, anticipas y lideras la conversación? ¿O solo respondes lo que te preguntan?</span></div></li><li><div><strong>🤝 Rapport</strong><br><span style="font-size:13px;color:var(--muted)">¿Hay conexión real? ¿usas el nombre del cliente, recuerdas detalles, haces la conversación humana?</span></div></li><li><div><strong>⚡ Manejo de fricción</strong><br><span style="font-size:13px;color:var(--muted)">¿Cómo reaccionas ante el enojo, la duda o el silencio? ¿Te frustras o contienes?</span></div></li><li><div><strong>🎯 Seguridad</strong><br><span style="font-size:13px;color:var(--muted)">¿transmites confianza en lo que ofreces o vacilas? El cliente compra al agente antes que al producto.</span></div></li></div></div>`;
html+=`<div class="card pad" style="margin-top:18px"><h2>🔍 El mismo momento — dos actitudes opuestas</h2><div class="example-wrap" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px"><div style="background:#fff0f0;border-radius:12px;padding:16px;border:1px solid #f2cdce"><strong style="color:#87353b">❌ Actitud REACTIVA</strong><div style="margin-top:10px;font-size:13px;color:#555"><p style="margin:0 0 6px"><strong>Cliente:</strong> Tengo dudas sobre si el seguro vale la pena.</p><p style="margin:0 0 6px"><strong>Agente:</strong> Es opcional, tú decides.</p><p style="margin:0 0 6px"><strong>Cliente:</strong> ¿Y si no lo tomo qué pasa?</p><p style="margin:0 0 6px"><strong>Agente:</strong> Cualquier problema corre por tu cuenta.</p><p style="margin:0"><strong>Cliente:</strong> Bueno, déjalo sin seguro.</p></div></div><div style="background:#e9f8f1;border-radius:12px;padding:16px;border:1px solid #bfe9d5"><strong style="color:#166045">✅ Actitud PROACTIVA</strong><div style="margin-top:10px;font-size:13px;color:#555"><p style="margin:0 0 6px"><strong>Cliente:</strong> Tengo dudas sobre si el seguro vale la pena.</p><p style="margin:0 0 6px"><strong>Agente:</strong> Entiendo la duda. Viajando con familia, lo más común son cancelaciones o imprevistos de salud. El seguro cubre hasta $50.000 en gastos médicos. Muchos clientes me dicen que fue lo mejor que contrataron. ¿Lo agregamos?</p><p style="margin:0"><strong>Cliente:</strong> Así visto sí tiene sentido. ¿Cuánto es?</p></div></div></div><div style="margin-top:14px;padding:12px 14px;background:#f0effc;border-radius:10px;font-size:13px;color:var(--primary)"><strong>🤖 Trix observa:</strong> El Agente A no fue grosero — simplemente fue neutral hasta el punto de ser contraproducente. El Agente B tomó la misma duda y la convirtió en una presentación personalizada. La diferencia no es de conocimiento — es de <strong>compromiso con el resultado</strong>.</div></div>`;
html+=`<div class="card pad" style="margin-top:18px"><h2>¿Cómo te analizo?</h2><div class="process" style="grid-template-columns:repeat(5,1fr)"><div class="process-step"><span class="number">1</span><h3>📥 Descargo tus llamadas</h3><p>El 100%, sin elegir ni filtrar por duración.</p></div><div class="process-step"><span class="number">2</span><h3>🌎 Activo el perfil de tu país</h3><p>Para entender tus modismos y expresiones.</p></div><div class="process-step"><span class="number">3</span><h3>📖 Leo la conversación</h3><p>Turno por turno, cliente y agente.</p></div><div class="process-step"><span class="number">4</span><h3>🔍 Identifico técnicas y actitud</h3><p>Qué estuvo, qué faltó, cómo fue el tono.</p></div><div class="process-step"><span class="number">5</span><h3>🎓 Genero el coaching</h3><p>Fortalezas, brechas y recomendaciones.</p></div></div></div>`;
html+=`<div class="card pad" style="margin-top:18px"><h2>❓ Preguntas frecuentes de agentes nuevos</h2><div class="param-list" style="grid-template-columns:1fr"><article class="param-card"><button class="param-head" data-expand><span class="param-name">¿Trix me pone nota?</span><span class="chevron">⌄</span></button><div class="param-body"><p>No. Trix <strong>describe</strong> lo que ve en tus llamadas, en lenguaje natural. No hay número, no hay score, no hay calificación. Lo que hacemos es ayudarte a entender qué técnicas usaste y cómo puedes mejorar. Los números los ve tu supervisor en otra herramienta.</p></div></article><article class="param-card"><button class="param-head" data-expand><span class="param-name">¿Escucha todas mis llamadas o solo algunas?</span><span class="chevron">⌄</span></button><div class="param-body"><p>Todas. Sin muestras, sin cortes. Esto es lo que hace a Trix diferente de una auditoría manual: el análisis no depende de si "te tocó" o no. Todas las llamadas del período entran al análisis por igual.</p></div></article><article class="param-card"><button class="param-head" data-expand><span class="param-name">¿Me va a juzgar si uso expresiones de mi país?</span><span class="chevron">⌄</span></button><div class="param-body"><p>Para nada. Antes de analizar cada llamada, activo el perfil cultural de tu mercado. Trix sabe que un "dale, lo armamos" en Argentina es un cierre activo. Un "ya po" en Chile tiene peso — y Trix lo reconoce. No te penaliza por hablar como hablas.</p></div></article><article class="param-card"><button class="param-head" data-expand><span class="param-name">¿Qué hago con el feedback que me da Trix?</span><span class="chevron">⌄</span></button><div class="param-body"><p>El feedback no es para angustiarse — es para crecer. Cuando Trix te dice "en esta llamada la urgencia fue vacía" o "el cliente estaba listo para cerrar y no lo invitaste a decidir", esa es información concreta que puedes aplicar en la próxima llamada. <strong>Tip:</strong> después de cada análisis, elige <strong>una sola técnica</strong> para mejorar. practica esa una cosa en tus próximas llamadas y revisa el siguiente feedback para ver si cambió.</p></div></article></div></div>`;
html+=`<div class="card pad" style="margin-top:18px"><h2>🌎 Contexto cultural — La misma frase cambia de significado por país</h2><p style="color:var(--muted);font-size:14px;margin:0 0 16px">Antes de leer una llamada, Trix activa el perfil cultural de tu país. Mismo país → mismo contexto interpretativo. No te penaliza por hablar como hablas.</p><div class="param-list" style="grid-template-columns:repeat(2,1fr)"><article class="param-card"><button class="param-head" data-expand><span style="font-size:20px;margin-right:8px">🇦🇷</span><span class="param-name">Argentina</span><span class="chevron">⌄</span></button><div class="param-body"><p><strong>"¿Lo cerramos?"</strong> → "Dale, lo armamos. ¿Qué tarjeta tienes?" — Cierre activo directo, trato de tú, informalidad rioplatense.</p><p style="margin-top:8px;font-size:13px;color:var(--muted)"><strong>No cuentan como técnica:</strong> "Perfecto" como acuse de escucha · "Dale" como muletilla · "¿Cómo te encuentras?" de apertura</p></div></article><article class="param-card"><button class="param-head" data-expand><span style="font-size:20px;margin-right:8px">🇲🇽</span><span class="param-name">México</span><span class="chevron">⌄</span></button><div class="param-body"><p><strong>"¿Lo cerramos?"</strong> → "Ahorita le proceso, ¿le parece bien?" — "Ahorita" en contexto de cierre = acción inmediata. Cierre activo con cortesía formal.</p><p style="margin-top:8px;font-size:13px;color:var(--muted)"><strong>No cuentan como técnica:</strong> "Con mucho gusto" de apertura · "Ahorita" genérico sin acción · "¿Cómo le puedo ayudar?" de inicio</p></div></article><article class="param-card"><button class="param-head" data-expand><span style="font-size:20px;margin-right:8px">🇧🇷</span><span class="param-name">Brasil</span><span class="chevron">⌄</span></button><div class="param-body"><p><strong>"¿Lo cerramos?"</strong> → "Bora fechar? Consigo confirmar agora." — "Bora" = gíria paulistana de incentivo a avanzar. Cierre activo informal pero decidido.</p><p style="margin-top:8px;font-size:13px;color:var(--muted)"><strong>Não contam como técnica:</strong> "Com certeza"/"claro" como acuse de escucha · "Oi, tudo bem?" de abertura · "Entendi" sin proposta concreta</p></div></article><article class="param-card"><button class="param-head" data-expand><span style="font-size:20px;margin-right:8px">🇨🇱</span><span class="param-name">Chile</span><span class="chevron">⌄</span></button><div class="param-body"><p><strong>"¿Lo cerramos?"</strong> → "Ya po, lo dejamos listo. ¿Arrancamos?" — "Ya po" + "listo" = confirmación + cierre en chilenismo. Cierre por acción compartida.</p><p style="margin-top:8px;font-size:13px;color:var(--muted)"><strong>No cuentan como técnica:</strong> "Ya" genérico · "Buena" como saludo · "¿Cómo estái?" de apertura · "Po/poh" como énfasis sin técnica</p></div></article><article class="param-card"><button class="param-head" data-expand><span style="font-size:20px;margin-right:8px">🇨🇴</span><span class="param-name">Colombia</span><span class="chevron">⌄</span></button><div class="param-body"><p><strong>"¿Lo cerramos?"</strong> → "Listo, con gusto lo gestiono." — Cierre formal con cortesía colombiana. "Listo" como confirmación de acción.</p><p style="margin-top:8px;font-size:13px;color:var(--muted)"><strong>No cuentan como técnica:</strong> "Con gusto"/"para servirle" de apertura · "Listo" como acuse de recibo · "Claro que sí" sin propuesta</p></div></article><article class="param-card"><button class="param-head" data-expand><span style="font-size:20px;margin-right:8px">🇵🇪</span><span class="param-name">Perú</span><span class="chevron">⌄</span></button><div class="param-body"><p><strong>"¿Lo cerramos?"</strong> → Formalidad peruana con cierre cortés. "Le atiendo" como transición de servicio.</p><p style="margin-top:8px;font-size:13px;color:var(--muted)"><strong>No cuentan como técnica:</strong> "Con mucho gusto" de apertura · "Perfecto" de escucha sin propuesta · "Le atiendo"/"Dígame" de inicio</p></div></article></div></div><div class="card pad" style="margin-top:18px;background:linear-gradient(135deg,var(--primary),#6554bd);color:#fff"><h2 style="color:#fff">🚀 ¿Listo para tu primera llamada?</h2><p style="font-size:15px;line-height:1.6;margin:8px 0 0;color:#ebe9ff">No necesitas hacer todo perfecto desde el primer día. elige <strong style="color:var(--yellow)">una técnica</strong> para practicar hoy. Después del análisis, elige otra. Así es como se construye un agente de ventas de alto impacto — con feedback concreto, llamada por llamada.</p></div>`;

function renderCalidadHumano(){markComplete('calidadhumano');let html=layout('Calidad humano','La calidad también se construye escuchando, entendiendo y conversando con las personas.');html+=`<div class="card pad" style="border-left:4px solid var(--yellow)"><h2>👁️ La auditoría es humana</h2><p>Un analista de calidad escucha la llamada completa y evalúa la intención detrás de lo que dices en cada parámetro. No solo revisa si una frase aparece: interpreta el contexto, el criterio y el impacto para el cliente.</p><div class="notice"><strong>La auditoría es humana.</strong> Tu voz, tu contexto y la intención de tu gestión importan.</div></div><div class="card pad" style="margin-top:18px"><h2>🔺 Triángulo Virtuoso: Trix + QA + Agente</h2><div class="trix-grid-3"><div class="trix-mini-card"><h3>🤖 Trix</h3><p>Observa conversaciones y acerca señales, patrones y ejemplos.</p></div><div class="trix-mini-card"><h3>👁️ QA</h3><p>Valida el contexto, escucha y aplica criterio humano por parámetro.</p></div><div class="trix-mini-card"><h3>🙋 Agente</h3><p>Recibe feedback, practica y convierte la oportunidad en acción.</p></div></div></div><div class="card pad" style="margin-top:18px"><h2>🤝 Modelo híbrido: Trix + Analistas</h2><p>Trix aporta alcance y memoria; el analista aporta criterio, empatía y conversación de desarrollo. Juntos permiten aprender de más llamadas sin perder humanidad.</p><ul class="check-list"><li>Escuchar el contexto completo.</li><li>Evaluar la intención y distinguir un error crítico de uno no crítico.</li><li>Conversar con claridad sobre fortalezas y oportunidades.</li><li>Acordar una práctica concreta para la siguiente gestión.</li></ul></div><div style="margin-top:24px;text-align:center"><button class="btn" data-action="parametros">Siguiente: Parámetros de calidad →</button></div>`;document.getElementById('view-calidadhumano').innerHTML=html}
function renderPolicy(){markComplete('politica');const p=CONTENT.politica_cobro;let html=layout('PI-Política de cobro','Entiende cuándo puede existir una pérdida atribuible y cómo se decide un descuento.');html+=`<div class="info-strip">${esc(p.objetivo)}</div><div class="card pad"><h2>El proceso en 6 pasos</h2><div class="process">${p.proceso.map(x=>`<div class="process-step"><span class="number">Paso ${x.paso}</span><h3>${esc(x.actor)}</h3><p>${esc(x.accion)}</p></div>`).join('')}</div></div><div class="policy-grid" style="margin-top:18px"><div class="card pad"><h2>Tabla de descuentos</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Antigüedad</th><th>Monto máximo</th><th>1ª PI</th><th>2ª PI</th><th>3ª PI</th></tr></thead><tbody>${p.tabla_descuentos.map(r=>`<tr><td>${esc(r.antiguedad)}</td><td>${esc(r.monto_max)}</td><td>${esc(r.primera_pi)}</td><td>${esc(r.segunda_pi)}</td><td>${esc(r.tercera_pi)}</td></tr>`).join('')}</tbody></table></div><div class="calc"><h3>🧮 Mini-calculadora</h3><div class="form-row"><div class="field"><label for="age">Antigüedad</label><select id="age"><option value="0">1 a 3 meses</option><option value="1">Más de 3 meses</option></select></div><div class="field"><label for="pi">Número de PI</label><select id="pi"><option value="1">1ª PI</option><option value="2">2ª PI</option><option value="3">3ª PI</option></select></div><div class="field"><label for="loss">Pérdida (USD)</label><input id="loss" type="number" min="0" step="1" value="500"></div><button class="btn" data-action="calculate">Calcular</button></div><div class="calc-result" id="calc-result">Selecciona las condiciones y calcula el monto.</div></div></div><div class="card pad"><h2>Condiciones de pérdida atribuible</h2><ul class="check-list">${p.condiciones_perdida.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3 style="margin:20px 0 9px;font-size:15px">Ejemplos</h3><ul class="plain-list">${p.ejemplos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><div class="policy-grid" style="margin-top:18px"><div class="card pad"><h2>Comité de incidencias</h2><ul class="plain-list">${p.comite.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card pad"><h2>Notas importantes</h2><ul class="plain-list">${p.notas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`;html+=`<div style="margin-top:24px;text-align:center"><button class="btn" data-action="home">← Volver al inicio</button></div>`;document.getElementById('view-politica').innerHTML=html}
function calc(){const row=CONTENT.politica_cobro.tabla_descuentos[Number(document.getElementById('age').value)];const pi=Number(document.getElementById('pi').value);const keys=['primera_pi','segunda_pi','tercera_pi'];const pct=Number(row[keys[pi-1]].replace('%',''));const max=Number(row.monto_max.replace(/[^0-9.]/g,''))*1000/1000;const loss=Math.max(0,Number(document.getElementById('loss').value)||0);const cover=Math.min((loss*pct)/100,max);document.getElementById('calc-result').innerHTML=`<strong>${pct}%</strong> aplicable · monto máximo de referencia: <strong>${esc(row.monto_max)}</strong> · con una pérdida de <strong>$${loss.toLocaleString('es-MX')} USD</strong>, el cálculo orientativo es <strong>$${cover.toLocaleString('es-MX',{maximumFractionDigits:2})} USD</strong>.`}

html+=`<div class="card pad" style="margin-top:18px;border-left:4px solid var(--green)"><h2>🛡️ Cómo EVITAR una PI — Mejores prácticas</h2><div class="param-list" style="grid-template-columns:1fr 1fr;margin-top:14px"><article class="param-card"><div class="param-body" style="display:block;padding:16px"><strong style="color:var(--green)">1. Confirmar antes de garantizar</strong><p style="margin:8px 0 0;font-size:13px"><span style="color:var(--red)">✗ MAL:</span> "Seguro incluye equipaje"<br><span style="color:var(--green)">✓ BIEN:</span> "Verifico en el sistema... SÍ incluye 1 equipaje de 23kg"</p></div></article><article class="param-card"><div class="param-body" style="display:block;padding:16px"><strong style="color:var(--green)">2. Leer en voz alta antes del pago</strong><p style="margin:8px 0 0;font-size:13px">"Confirmo: Hotel Ibis, entrada 15-dic, salida 20-dic, 2 adultos, habitación doble". Esperar que el cliente diga <strong>"CORRECTO"</strong>.</p></div></article><article class="param-card"><div class="param-body" style="display:block;padding:16px"><strong style="color:var(--green)">3. Deletrear nombres y datos críticos</strong><p style="margin:8px 0 0;font-size:13px">"Su nombre es María, M-A-R-Í-A con acento en la I, ¿correcto?" · "Fecha 11 de septiembre, uno-uno barra cero-nueve"<br><strong>Alfabeto aeronáutico:</strong> A=Alfa, B=Bravo, C=Charlie, D=Delta, E=Eco, F=Foxtrot, G=Golf, H=Hotel, I=India, J=Juliet, K=Kilo, L=Lima, M=Mike, N=November, O=Oscar, P=Papa, Q=Quebec, R=Romeo, S=Sierra, T=Tango, U=Uniform, V=Victor, W=Whiskey, X=X-ray, Y=Yankee, Z=Zulu. Ejemplo: M de Mike, A de Alfa, R de Romeo, Í de India.</p></div></article><article class="param-card"><div class="param-body" style="display:block;padding:16px"><strong style="color:var(--green)">4. No asumir — verificar en el sistema</strong><p style="margin:8px 0 0;font-size:13px"><span style="color:var(--red)">✗ MAL:</span> "Normalmente incluye desayuno"<br><span style="color:var(--green)">✓ BIEN:</span> "Verifico... Este hotel NO incluye desayuno, se paga aparte"</p></div></article><article class="param-card"><div class="param-body" style="display:block;padding:16px"><strong style="color:var(--green)">5. Informar cargos adicionales</strong><p style="margin:8px 0 0;font-size:13px">"El precio es $500 + impuestos de $75 = $575 total" · "Este hotel cobra resort fee de $20 por noche directamente en recepción"</p></div></article><article class="param-card"><div class="param-body" style="display:block;padding:16px"><strong style="color:var(--green)">6. Corregir inmediatamente si hay error</strong><p style="margin:8px 0 0;font-size:13px">Si prometiste algo incorrecto → corregir <strong>antes del pago</strong>. Verificar que el cliente escuchó y entendió la corrección.</p></div></article><article class="param-card" style="grid-column:1/-1"><div class="param-body" style="display:block;padding:16px"><strong style="color:var(--green)">7. Documentar todo lo material</strong><p style="margin:8px 0 0;font-size:13px">Tipo de camas · Régimen alimenticio (desayuno, todo incluido, etc.) · Equipaje incluido · Edades correctas de pasajeros · Requisitos de documentación. Si el cliente tiene dudas técnicas → redirigir a postventa o al proveedor.</p></div></article>

.</li><li>Solicité el refute a mi supervisor; no envío el correo.</li></ul></div><div style="margin-top:24px;text-align:center"><button class="btn" data-action="politica">Siguiente: PI-Política de cobro →</button></div>`;document.getElementById('view-refute').innerHTML=html}

const FC_FILTER_ALL='Todos';
let fcState={cards:[],index:0,flipped:false,known:[],review:[],filter:FC_FILTER_ALL};
function buildFcDeck(filter){let cards=[...FLASHCARDS];if(filter==='IN')cards=cards.filter(c=>c.canal.includes('IN'));else if(filter==='WA')cards=cards.filter(c=>c.canal.includes('WA'));else if(filter==='Crítico')cards=cards.filter(c=>c.tipo==='Crítico');fcState.cards=cards;fcState.index=0;fcState.flipped=false;fcState.known=[];fcState.review=[];}
function renderFlashcards(){
  markComplete('flashcards');
  if(!fcState.cards.length)buildFcDeck(fcState.filter);
  const el=document.getElementById('view-flashcards');
  const total=fcState.cards.length;
  const done=fcState.known.length+fcState.review.length;
  if(fcState.index>=total){
    const knowPct=total?Math.round(fcState.known.length/total*100):0;
    let html=layout('Repaso rápido','Resultados de la sesión de flashcards.');
    html+=`<div class="fc-result-grid"><div class="fc-result-box" style="background:#e9f8f1;color:#166045"><strong>${fcState.known.length}</strong><span>Las domino ✓</span></div><div class="fc-result-box" style="background:#fff0f0;color:#87353b"><strong>${fcState.review.length}</strong><span>A repasar ⚠️</span></div></div>`;
    if(fcState.review.length){
      html+=`<div class="card pad" style="margin-bottom:18px"><h2 style="font-size:16px;margin:0 0 12px;color:var(--red)">⚠️ Parámetros para reforzar</h2><div class="missed-list">`;
      fcState.review.forEach(c=>{html+=`<div class="missed-item"><span>${esc(c.frente)}</span><span class="badge ${c.tipo==='Crítico'?'ec':'enc'}">${esc(c.tipo)}</span></div>`;});
      html+=`</div></div>`;
    }
    html+=`<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-action="restart-fc">Repetir mazo</button><button class="btn ghost" data-action="restart-fc-review">Solo las de repaso (${fcState.review.length})</button><button class="btn ghost" data-action="home">← Inicio</button></div>`;
    el.innerHTML=html;return;
  }
  const card=fcState.cards[fcState.index];
  let html=layout('Repaso rápido','Haz clic en la tarjeta para ver la respuesta.');
  html+=`<div class="fc-filter">${[FC_FILTER_ALL,'IN','WA','Crítico'].map(f=>`<button class="pill${fcState.filter===f?' active':''}" data-fc-filter="${f}">${f}</button>`).join('')}</div>`;
  html+=`<div class="fc-progress-bar"><div class="fc-progress-fill" style="width:${done/total*100}%"></div></div>`;
  html+=`<div style="text-align:right;font-size:12px;color:#c4bfea;margin-bottom:10px">${done+1} / ${total}</div>`;
  html+=`<div class="fc-wrap${fcState.flipped?' flipped':''}" id="fc-card" data-action="flip-fc"><div class="fc-inner"><div class="fc-face fc-front"><div class="fc-tag">Parámetro · ${esc(card.canal)}</div><div class="fc-q">${esc(card.frente)}</div><div class="fc-hint">Toca para ver la respuesta</div></div><div class="fc-face fc-back"><div class="fc-tag">${badge(card.tipo)}</div><div class="fc-a">${esc(card.respuesta)}</div></div></div></div>`;
  if(fcState.flipped){
    html+=`<div class="fc-actions"><button class="btn btn-review" data-action="fc-review">⚠️ A repasar</button><button class="btn btn-know" data-action="fc-know">✓ Lo domino</button></div>`;
  }
  el.innerHTML=html;
}

let CATALOGO = [];
async function loadCatalog(){try{CATALOGO=await fetch('catalogo.json').then(response=>response.json())}catch(error){CATALOGO=[]}}
function showRegistrationError(text){document.getElementById('regError').textContent=text||'';document.getElementById('manualError').textContent=text||''}
function resetRegistration(){document.getElementById('registration').classList.remove('hidden');document.getElementById('app-shell')?.classList.remove('signed-in');document.querySelector('.app-shell').style.display='none';document.getElementById('regUser').value='';document.getElementById('regFound').hidden=true;document.getElementById('regCatalogStart').disabled=true;showRegistrationError('');activateRegTab('catalog')}
function logout(){sessionStorage.removeItem('calidad-telesales-user');localStorage.removeItem('calidad-telesales-agent-v1');localStorage.removeItem('calidad-telesales-progress-v1');currentUser=null;progress={completed:[],simulatorScore:null,average:0};state.view='home';state.simSubmitted=false;document.querySelectorAll('.view').forEach(view=>view.classList.remove('active'));document.getElementById('view-home').classList.add('active');document.querySelector('.app-shell').style.display='none';document.getElementById('registration').classList.remove('hidden');document.getElementById('registration').style.display='grid';showToast('Sesión cerrada')}
function renderSidebar(){const box=document.getElementById('sidebarModules');if(!box)return;box.innerHTML=MODULES.map(module=>`<button class="${state.view===module.id?'active':''}" data-action="${module.id}">${progress.completed.includes(module.id)?'✓':'○'} ${module.title}</button>`).join('')}
function openApp(){document.getElementById('registration').classList.add('hidden');document.querySelector('.app-shell').style.display='block';refreshUserHeader();renderSidebar();render('home')}
function activateRegTab(tab){document.querySelectorAll('.registration-tab').forEach(item=>item.classList.toggle('active',item.dataset.regTab===tab));document.querySelectorAll('.reg-pane').forEach(item=>item.classList.toggle('active',item.id==='reg-'+tab))}
function catalogLookup(){const input=document.getElementById('regUser'),found=document.getElementById('regFound'),btn=document.getElementById('regCatalogStart'),email=input.value.trim().toLowerCase(),agent=CATALOGO.find(item=>String(item.e||'').toLowerCase()===email);if(agent){found.hidden=false;found.innerHTML=`<strong>${esc(agent.n)}</strong><br>Supervisor: ${esc(agent.s||'No asignado')}<br>LOB: ${esc(agent.l||'No asignada')}`;showRegistrationError('');btn.disabled=false}else{found.hidden=true;btn.disabled=true;showRegistrationError(email?'No encontramos ese correo. Usa Registro manual si eres parte de QA u otro equipo.':'')}}
async function completeRegistration(payload){const button=payload.source==='catalog'?document.getElementById('regCatalogStart'):document.getElementById('regManualStart');button.disabled=true;showRegistrationError('');try{const user=await apiCall('/api/register',{method:'POST',body:JSON.stringify(payload)});currentUser=user;sessionStorage.setItem('calidad-telesales-user',JSON.stringify(user));openApp();await hydrateProgress()}catch(error){showRegistrationError(error.message)}finally{button.disabled=false}}
function bind(){document.addEventListener('click',event=>{const regtab=event.target.closest('[data-reg-tab]');if(regtab){activateRegTab(regtab.dataset.regTab);return}const action=event.target.closest('[data-action]');if(action){const act=action.dataset.action;if(act==='home'){go('home');return}if(act==='restart-sim'){Object.assign(state,{simIndex:0,simScore:0,simMisses:[],simFeedback:null,simSubmitted:false});render('simulador');return}
if(act==='flip-fc'){fcState.flipped=!fcState.flipped;render('flashcards');return}
if(act==='fc-know'){fcState.known.push(fcState.cards[fcState.index]);fcState.index++;fcState.flipped=false;render('flashcards');return}
if(act==='fc-review'){fcState.review.push(fcState.cards[fcState.index]);fcState.index++;fcState.flipped=false;render('flashcards');return}
if(act==='restart-fc'){buildFcDeck(fcState.filter);render('flashcards');return}
if(act==='restart-fc-review'){const reviewCards=[...fcState.review];fcState.cards=reviewCards;fcState.index=0;fcState.flipped=false;fcState.known=[];fcState.review=[];render('flashcards');return}if(act==='next-sim'){state.simIndex++;state.simFeedback=null;render('simulador');return}if(act==='retry-sim'){state.simFeedback=null;render('simulador');return}if(act==='calculate'){calc();return}if(MODULES.some(module=>module.id===act)){go(act);return}}const channel=event.target.closest('[data-param-channel]');if(channel){state.paramChannel=channel.dataset.paramChannel;render('parametros');return}const simChannel=event.target.closest('[data-sim-channel]');if(simChannel){state.simChannel=simChannel.dataset.simChannel;Object.assign(state,{simIndex:0,simScore:0,simMisses:[],simFeedback:null});render('simulador');return}const sale=event.target.closest('[data-sale]');if(sale){state.sale=sale.dataset.sale;render('parametros');return}
const fcFilter=event.target.closest('[data-fc-filter]');if(fcFilter){fcState.filter=fcFilter.dataset.fcFilter;buildFcDeck(fcState.filter);render('flashcards');return}const expand=event.target.closest('[data-expand]');if(expand){expand.closest('.param-card').classList.toggle('open');return}const choice=event.target.closest('[data-sim-choice]');if(choice&&state.simFeedback===null){const steps=state.simChannel==='wa'?waSteps:callSteps,item=steps[state.simIndex],index=Number(choice.dataset.simChoice),good=index===item.correct;if(good)state.simScore++;else state.simMisses.push(item.rule);state.simFeedback={good,text:item.explanation||(good?'Elegiste una respuesta alineada con el parámetro oficial.':'Tu respuesta no cubre el comportamiento esperado.'),rule:good?null:item.rule};render('simulador');return}});
document.getElementById('brandHome').addEventListener('click',()=>go('home'));
document.getElementById('menuToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open')});
document.getElementById('sidebarOverlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open')});
document.getElementById('logoutButton').addEventListener('click',logout);
document.getElementById('regUser').addEventListener('input',catalogLookup);
document.getElementById('regCatalogStart').addEventListener('click',()=>{const email=document.getElementById('regUser').value.trim().toLowerCase();const agent=CATALOGO.find(item=>String(item.e||'').toLowerCase()===email);if(agent)completeRegistration({source:'catalog',email})});
document.getElementById('regManualStart').addEventListener('click',()=>{const email=document.getElementById('manualUser').value.trim().toLowerCase(),country=document.getElementById('manualLob').value,supervisor=document.getElementById('manualSupervisor').value.trim();if(!email||!email.includes('@')||!country||!supervisor){document.getElementById('manualError').textContent='Completa correo, LOB y supervisor.';return}document.getElementById('manualError').textContent='';completeRegistration({source:'manual',email,country,supervisor})});

// LOGIC FOR LOGIN TAB
document.getElementById('loginStart').addEventListener('click', async () => {
    const email = document.getElementById('loginUser').value.trim().toLowerCase();
    if(!email || !email.includes('@')) {
        document.getElementById('loginError').textContent = 'Por favor, ingresa tu correo.';
        return;
    }
    const button = document.getElementById('loginStart');
    button.disabled = true;
    document.getElementById('loginError').textContent = 'Buscando progreso...';
    
    try {
        const user = await apiCall('/api/register', {
            method: 'POST',
            body: JSON.stringify({ email: email })
        });
        currentUser = user;
        sessionStorage.setItem('calidad-telesales-user', JSON.stringify(user));
        await hydrateProgress();
        openApp();
    } catch(e) {
        currentUser = { email: email, name: email.split('@')[0] };
        sessionStorage.setItem('calidad-telesales-user', JSON.stringify(currentUser));
        openApp();
    }
    
    button.disabled = false;
    document.getElementById('loginError').textContent = '';
});

}

async function initApp(){await loadCatalog();const saved=sessionStorage.getItem('calidad-telesales-user');if(saved){try{currentUser=JSON.parse(saved);if(currentUser.email&&currentUser.email.includes('@')){try{await hydrateProgress()}catch(e){}}openApp();return}catch(error){sessionStorage.removeItem('calidad-telesales-user')}}document.querySelector('.app-shell').style.display='none'}

bind();initApp();
</script>
